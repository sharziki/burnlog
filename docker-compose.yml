services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: burnlog
      POSTGRES_PASSWORD: burnlog
      POSTGRES_DB: burnlog
    volumes:
      - burnlog_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnlog -d burnlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://burnlog:burnlog@db:5432/burnlog?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      BURNLOG_ADMIN_LOGIN: ${BURNLOG_ADMIN_LOGIN:-sharziki}
      BURNLOG_ADMIN_TOKEN: ${BURNLOG_ADMIN_TOKEN:-}
      BURNLOG_DOLLARS_PER_TOKEN: ${BURNLOG_DOLLARS_PER_TOKEN:-0.00001}
      BURNLOG_WEBHOOK_SECRET: ${BURNLOG_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_BURNLOG_DOLLARS_PER_TOKEN: ${NEXT_PUBLIC_BURNLOG_DOLLARS_PER_TOKEN:-0.00001}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "3100:3000"

volumes:
  burnlog_pgdata:
