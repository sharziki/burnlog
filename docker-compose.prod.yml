services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: burnlog
      POSTGRES_PASSWORD: burnlog
      POSTGRES_DB: burnlog
    volumes:
      - burnlog_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnlog -d burnlog"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: postgresql://burnlog:burnlog@db:5432/burnlog?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      BURNLOG_ADMIN_LOGIN: ${BURNLOG_ADMIN_LOGIN:-sharziki}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    depends_on:
      - web
    command: tunnel --no-autoupdate --url http://web:3000 --metrics 0.0.0.0:2000

volumes:
  burnlog_pgdata:
