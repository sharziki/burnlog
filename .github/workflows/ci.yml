name: ci

on:
  pull_request:
  push:
    branches: [master]

jobs:
  web:
    name: web · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          # Dummy URL — generate does not need a live DB, but the Prisma CLI
          # refuses to run without a non-empty DATABASE_URL.
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://fake:fake@localhost:5432/fake
          AUTH_SECRET: ci-dummy-secret-value-for-build-only-1234567890
          NEXT_PUBLIC_SITE_URL: https://burnlog.net

  cli:
    name: cli · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  sdk:
    name: sdk · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  mcp:
    name: mcp · typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  consistency:
    name: cross-package · cli and web agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Catches the failures that live between the packages, where each side
      # typechecks and builds fine on its own: the CLI defaulting to a host that
      # no longer resolves, and the site advertising a tool no adapter exists
      # for. Both shipped, both were invisible to every other job here.
      - run: node scripts/consistency.mjs
