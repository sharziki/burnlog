name: production smoke

# The whole point of this file is that nobody has to remember.
#
# A smoke script already existed and was good; it just never ran unless someone
# typed it, so production sat broken for days at a time while CI stayed green —
# GitHub sign-in failed for every visitor, the profile page took ten seconds,
# and the CLI pointed at a host that had stopped resolving. None of those are
# things a build can catch, and all of them are things a request can.
on:
  schedule:
    # Every 30 minutes. Cheap, and the failures this catches are the kind that
    # get worse the longer nobody knows.
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [master]

# A newer push supersedes an older one; its commit may never be the one serving.
concurrency:
  group: smoke-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  smoke:
    name: burnlog.net answers, and answers fast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Wait for *this* commit to be serving, not just for time to pass. A
      # failed deploy leaves the previous build up, and the previous build
      # passes every smoke check — a fixed sleep let 23 days of failed deploys
      # go green. No match in 10 minutes means the deploy did not land.
      - name: Wait for this commit to be live
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 60); do
            live=$(curl -fsS https://burnlog.net/api/health | node -pe 'JSON.parse(require("fs").readFileSync(0)).commit' || true)
            if [ "$live" = "$GITHUB_SHA" ]; then echo "live: $live"; exit 0; fi
            echo "serving ${live:-unknown}, waiting for $GITHUB_SHA"; sleep 10
          done
          echo "::error::Deploy of $GITHUB_SHA never went live. Check the Vercel deployment log (Root Directory must be 'web')."
          exit 1

      - name: Smoke test production
        working-directory: web
        run: node scripts/smoke.mjs https://burnlog.net

      - name: Cross-package drift
        run: node scripts/consistency.mjs
